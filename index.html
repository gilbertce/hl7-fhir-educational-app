<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HL7 v2 ↔ FHIR Educational App</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main>
        <h1>HL7 v2 ↔ FHIR Educational App</h1>

        <p>
            Explore how a simulated HL7 v2 lab result can be represented
            using FHIR-style JSON.
        </p>

        <section>
            <h2>HL7 v2 Message</h2>

            <p>
                Paste a simulated HL7 v2 message below or load a sample message.
            </p>

            <textarea
                id="hl7-input"
                rows="12"
                cols="80"
                placeholder="Enter HL7 v2 message here..."
            ></textarea>

            <div>
                <button id="load-sample-button">Load Sample</button>
                <button id="parse-button">Parse Message</button>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
